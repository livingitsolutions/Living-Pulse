# Compatibility entry point for workspace-filtered Netlify CLI deploys.
# The Growth project itself selects the canonical repository-root
# netlify.growth.toml configuration.

[build]
  command = "npm run build:growth"
  publish = "dist-growth"

[functions]
  directory = "netlify/growth-functions"

[database.migrations]
  path = "netlify/database/migrations"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

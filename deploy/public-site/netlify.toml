[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/operator/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/growth"
  to = "/404"
  status = 404

[[redirects]]
  from = "/growth/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
